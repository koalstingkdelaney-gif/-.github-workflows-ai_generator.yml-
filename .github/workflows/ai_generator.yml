name: Cloud AI Developer Tool Generator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Tool via Cloud Script
        run: |
          python3 -c '
          import os
          os.makedirs("tools", exist_ok=True)
          filename = "tools/utility_script.py"
          with open(filename, "w") as f:
              f.write("# Auto-generated developer utility\nprint(\"Cloud tool active\")\n")
          '

      - name: Validate Code Syntax
        run: python3 -m py_compile tools/*.py

      - name: Commit and Push safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GhostCorp-Cloud-Bot"
          git config --global user.email "bot@ghostcorp.internal"
          
          # Ignore pycache files so they don't get tracked
          echo "__pycache__/" >> .gitignore
          
          git add tools/ .gitignore
          git diff --cached --quiet || git commit -m "Add daily AI-generated developer utility tool"
          
          # Pull any remote changes first to prevent rejection
          git pull origin main --rebase || echo "No rebase needed"
          
          git push origin main
